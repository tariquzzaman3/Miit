name: Miit Band 9 auth patch

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/miit-auth-fix.yml'
      - 'app/band/auth_patch_applied.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Xiaomi auth sequencing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/band/BandScanner.kt')
          s=p.read_text()
          old='''                enableNotification(g, xiaomiAuth); _state.value = BandConnectionState.Authenticating\n                xiaomiAuthenticator = XiaomiBand8Authenticator(authKey, { e -> MiitTestLog.add("Xiaomi auth: $e") }) { ok, error -> _state.value = if (ok) BandConnectionState.Authenticated else BandConnectionState.Error; MiitTestLog.add(if (ok) "Xiaomi auth: initialized" else "Xiaomi auth failed: ${error ?: "unknown error"}") }\n                xiaomiAuthenticator?.start(g, xiaomiAuth); return\n'''
          new='''                _state.value = BandConnectionState.Authenticating\n                xiaomiAuthenticator = XiaomiBand8Authenticator(authKey, { e -> MiitTestLog.add("Xiaomi auth: $e") }) { ok, error -> _state.value = if (ok) BandConnectionState.Authenticated else BandConnectionState.Error; MiitTestLog.add(if (ok) "Xiaomi auth: initialized" else "Xiaomi auth failed: ${error ?: "unknown error"}") }\n                enableNotificationAndStartXiaomiAuth(g, xiaomiAuth); return\n'''
          if old not in s:
              raise SystemExit('expected BandScanner auth block not found')
          s=s.replace(old,new)
          marker='''    @SuppressLint("MissingPermission") private fun enableNotification(gatt: BluetoothGatt, characteristic: BluetoothGattCharacteristic) {\n'''
          insert='''    @SuppressLint("MissingPermission") private fun enableNotificationAndStartXiaomiAuth(gatt: BluetoothGatt, characteristic: BluetoothGattCharacteristic) {\n        if (!gatt.setCharacteristicNotification(characteristic, true)) {\n            MiitTestLog.add("Xiaomi auth: setCharacteristicNotification=false")\n            _state.value = BandConnectionState.Error\n            return\n        }\n        val descriptor = characteristic.getDescriptor(CLIENT_CONFIG_DESCRIPTOR)\n        if (descriptor == null) {\n            MiitTestLog.add("Xiaomi auth: CCCD missing")\n            _state.value = BandConnectionState.Error\n            return\n        }\n        @Suppress("DEPRECATION") descriptor.value = BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE\n        MiitTestLog.add("Xiaomi auth: enabling notification; waiting for descriptor write")\n        @Suppress("DEPRECATION") gatt.writeDescriptor(descriptor)\n    }\n\n'''
          if marker not in s:
              raise SystemExit('notification marker not found')
          s=s.replace(marker,insert+marker)
          old_cb='''        @Suppress("DEPRECATION") override fun onCharacteristicChanged(g: BluetoothGatt, characteristic: BluetoothGattCharacteristic) { onCharacteristicChanged(g, characteristic, characteristic.value ?: byteArrayOf()) }\n        override fun onCharacteristicRead'''
          new_cb='''        @Suppress("DEPRECATION") override fun onCharacteristicChanged(g: BluetoothGatt, characteristic: BluetoothGattCharacteristic) { onCharacteristicChanged(g, characteristic, characteristic.value ?: byteArrayOf()) }\n        @Suppress("DEPRECATION") override fun onDescriptorWrite(g: BluetoothGatt, descriptor: BluetoothGattDescriptor, status: Int) {\n            MiitTestLog.add("Xiaomi auth: CCCD write status=$status")\n            if (descriptor.uuid == CLIENT_CONFIG_DESCRIPTOR && status == BluetoothGatt.GATT_SUCCESS && xiaomiAuthenticator != null) {\n                val authChar = g.getService(XIAOMI_SERVICE)?.getCharacteristic(XIAOMI_COMMAND)\n                if (authChar != null) {\n                    MiitTestLog.add("Xiaomi auth: CCCD enabled; sending nonce")\n                    xiaomiAuthenticator?.start(g, authChar)\n                } else {\n                    MiitTestLog.add("Xiaomi auth: command characteristic missing after CCCD")\n                    _state.value = BandConnectionState.Error\n                }\n            } else if (descriptor.uuid == CLIENT_CONFIG_DESCRIPTOR) {\n                MiitTestLog.add("Xiaomi auth: CCCD enable failed")\n                _state.value = BandConnectionState.Error\n            }\n        }\n        override fun onCharacteristicRead'''
          if old_cb not in s:
              raise SystemExit('callback marker not found')
          s=s.replace(old_cb,new_cb)
          p.write_text(s)
          Path('app/band/auth_patch_applied.txt').write_text('Band 9 auth sequencing patch applied\n')
          PY
      - name: Commit patch
        run: |
          git config user.name 'Miit Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/band/BandScanner.kt app/band/auth_patch_applied.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Band 9 auth notification sequencing'
          git push
